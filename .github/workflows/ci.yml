name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify compares each Project with its last published version, which
          # it reads from the Project's <name>@<version> tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Merge gate: every Project's starter code and Reference Solutions must
      # fit its Steps, and published Steps must not get stricter within a major
      # version (docs/project-layout.md).
      - name: Verify every Project
        run: npm run fieldwork -- verify
      # The README's Track and Project listings are generated from track.json
      # and fieldwork.json, so they must not drift from them.
      - name: Check the README matches the metadata
        run: npm run fieldwork -- readme --check

  # Publishes each Project whose version has no <template repository>@<version>
  # tag yet to its template repository in the fieldwork-learn org, so templates
  # are never maintained by hand (#21). Only from main, once every check passed.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled half way: a later run finishes
    # whatever an earlier one left undone.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      # Pushes the monorepo tags. Template repositories are written with the App's token.
      contents: write
    steps:
      # The fieldwork-publisher GitHub App may create and push to repositories
      # in the fieldwork-learn org, and nothing else (ADR-0003).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: fieldwork-learn
      - uses: actions/checkout@v4
        with:
          # Which versions are already published is read from the tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit and push as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Publish Projects to their template repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run fieldwork -- publish-templates
